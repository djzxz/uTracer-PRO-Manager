name: Import uTracer source and database

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Install complete source tree and Git LFS database
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* > /tmp/utracer-source.tar.gz
          echo "0d266ebb839be02cd1ace665e87a90ab3b177d0f76afbb708ddae83c0f5dc67f  /tmp/utracer-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/utracer-source.tar.gz -C .
          rm -rf .bootstrap
          git lfs install --local
          git lfs track "*.db"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Dodaj pełny kod i bazę SQLite v2.43.1"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
