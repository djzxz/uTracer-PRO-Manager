name: uTracer safety build

on:
  push:
    branches:
      - fix/cp78-safety-gui-alignment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-selftest:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore uTracerProManager.sln

      - name: Build Release
        run: dotnet build uTracerProManager.sln -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project tests/uTracerProManager.SelfTest/uTracerProManager.SelfTest.csproj -c Release --no-build
